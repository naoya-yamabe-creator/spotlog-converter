name: Keep Streamlit App Alive

on:
  schedule:
    # 6時間おきに自動アクセスしてスリープを防止
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -L -s -o /dev/null -w "%{http_code}" "https://spotlog-converter.streamlit.app"
